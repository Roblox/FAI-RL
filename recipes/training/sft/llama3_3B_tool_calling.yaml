# Model Configuration
# Defines the base model and its loading parameters
model:
  base_model_name: "meta-llama/Llama-3.2-3B-Instruct"   # HuggingFace model name or local path
  torch_dtype: "bfloat16"                               # Data type for model weights (bfloat16/float16/float32)
  low_cpu_mem_usage: true                               # Reduce CPU memory usage during model loading
  load_in_8bit: false                                   # Enable 8-bit quantization
  load_in_4bit: false                                   # Enable 4-bit quantization (for QLoRA)
  use_flash_attention: false                            # Use Flash Attention for faster training (if supported)

  # LoRA configuration (for parameter-efficient fine-tuning)
  use_lora: true                                        # Enable LoRA
  lora_r: 8                                             # LoRA rank (8 for LoRA, 16 for QLoRA)
  lora_alpha: 16                                        # LoRA alpha scaling factor (typically 2x rank)
  lora_dropout: 0.05                                    # LoRA dropout rate
  lora_target_modules:                                  # Target modules for LoRA
    - q_proj
    - v_proj
    - k_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_bias: "none"                                     # Bias handling: "none", "all", or "lora_only"

# Data Configuration
# OpenAI-format tool-calling conversations. Each assistant turn becomes one
# example whose loss covers only that turn (see trainers/README.md).
data:
  datasets:
    - name: "data/sft/example_tool_calling.jsonl"       # JSONL rows: {"messages": [...], "tools": [...]}

  messages_column: "messages"                           # system/user/assistant/tool messages with tool_calls
  tools_column: "tools"                                 # Per-row OpenAI function definitions (optional)
  max_length: 4096                                      # Turns longer than this (prompt included) are dropped
  remove_unused_columns: false

# To warm up for a tool_environment GRPO stage, set the same tool_environment
# block here and drop tools_column: recorded calls are rewritten into the
# environment's call_tool view. tool_environment requires Qwen/Qwen3.8-27B.

# Training Configuration
# Controls the training process and optimization settings
training:
  algorithm: "sft"                                      # Training algorithm: sft, dpo, grpo, gspo
  output_dir: "models/llama3-3B-inst-sft-tool-calling-lora-v1" # Directory to save trained model and checkpoints

  # Core training hyperparameters
  per_device_train_batch_size: 1                        # Batch size per GPU (adjust based on GPU memory)
  gradient_accumulation_steps: 16                       # Steps to accumulate gradients (effective batch = batch_size × accum_steps × num_gpus)
  learning_rate: 1.0e-4                                 # Learning rate (1e-5 for full/LoRA, 1e-4 to 2e-4 for QLoRA)
  num_train_epochs: 1                                   # Number of complete passes through the dataset
  max_steps: -1                                         # Maximum number of training steps (-1 = train for num_train_epochs)
  warmup_steps: 10                                      # Linear warmup steps for learning rate scheduler

  # Logging and checkpointing
  logging_steps: 5                                      # Log training metrics every N steps
  save_steps: 50                                        # Save model checkpoint every N steps
  eval_steps: 50                                        # Evaluate model every N steps
  eval_enabled: true
  early_stopping: true                                  # Hold out eval_split_ratio of train; stop when eval_loss plateaus
  early_stopping_patience: 3                            # Evals with no improvement before stop
  early_stopping_threshold: 0.0                         # Minimum eval_loss delta to reset patience
  eval_split_ratio: 0.1                                 # Fraction of conversations held out for eval (whole conversations)

  # Memory and precision optimization
  bf16: true                                            # Use bfloat16 precision (recommended for modern GPUs)
  fp16: false                                           # Use float16 precision (alternative to bf16)
  gradient_checkpointing: true                          # Trade compute for memory (enables larger models/batch sizes)

  # Data loading optimization
  dataloader_num_workers: 0                             # Number of CPU workers for data loading (0 = main process only)
  dataloader_pin_memory: false                          # Pin memory for faster GPU transfer (set true if sufficient RAM)
  dataloader_drop_last: true                            # Drop last incomplete batch to ensure consistent batch sizes

# Weights & Biases Integration
wandb:
  enabled: false                                        # Enable W&B logging
  project: "your-project"                               # W&B project name
  entity: "your-wandb-entity"                           # W&B username or team name
  name: "Llama-3.2-3B-Inst-LoRA-SFT-tool-calling"       # Experiment name in W&B
  tags: ["SFT", "llama3", "3B-Inst", "LoRA", "tool-calling"]
  api_key: null                                         # W&B API key (null = use WANDB_API_KEY env var or prior `wandb login`)
  base_url: "https://api.wandb.ai"                      # W&B base URL (null = use WANDB_BASE_URL env var)

# S3 Checkpoint Upload
s3:
  enabled: false                                        # Enable S3 checkpoint upload
  bucket: "your-s3-bucket"                              # S3 bucket name
  prefix: "checkpoints/llama3-3B-inst-sft-tool-calling-lora-v1"
  region: null                                          # AWS region (null = use AWS_DEFAULT_REGION env var or boto3 default)
  endpoint_url: null                                    # Custom S3-compatible endpoint (e.g. MinIO). null = AWS S3
  upload_checkpoints: true                              # Upload intermediate checkpoints (at every save_steps)
  upload_final_model: true                              # Upload the final model at end of training
  delete_local_after_upload: false                      # Delete local checkpoint files after successful upload
