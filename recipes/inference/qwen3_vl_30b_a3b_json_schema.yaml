# Structured (JSON) inference for a fine-tuned Qwen3-VL-30B-A3B checkpoint.
#
# Setting `json_schema` constrains decoding so every response is JSON that follows
# the schema, and adds parse_ok / schema_error columns to the output CSV.
# Requires the structured extra:
#
#   pip install "FAI-RL[structured]"
#   fai-rl-inference --recipe recipes/inference/qwen3_vl_30b_a3b_json_schema.yaml
#
# See recipes/inference/qwen3_vl_30b_a3b.yaml for the VLM and multi-GPU options.
inference:
  model_paths:
    - "models/qwen3-vl-30b-a3b-sft-lora-v1"

  output_file: "outputs/qwen3-vl-30b-a3b-sft-lora-v1-json.csv"

  dataset_name: "s3://your-bucket/datasets/example_inference_data.csv"
  dataset_split: "test"
  dataset_columns: ["image_url", "question"]
  response_column: "response"

  image_columns: ["image_url"]
  image_cache_dir: "data/vlm_image_cache"
  max_image_pixels: 1048576         # ~1MP; match what you trained with

  system_prompt: "Classify the image. Reply with JSON only."
  user_prompt: "{question}"

  # A schema forces JSON from the first generated token, so thinking must be off.
  enable_thinking: false

  # JSON Schema (a YAML mapping or a JSON string). Every response is decoded to
  # match it; leave max_new_tokens large enough for the complete object.
  json_schema:
    type: object
    properties:
      decision:
        type: string
        enum: ["allow", "block"]
      category:
        type: string
        enum: ["none", "violence", "spam", "other"]
      confidence:
        type: string
        enum: ["low", "medium", "high"]
      summary:
        type: string
    required: ["decision", "category", "confidence", "summary"]
    additionalProperties: false

  # Generation parameters. Greedy decoding for reproducible labels.
  temperature: 1.0
  top_p: 0.9
  max_new_tokens: 256
  do_sample: false
